<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрут беременности · NomoVita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@400;500;600&family=Unbounded:wght@300;400;500&display=swap">
<style>
:root{
  --paper:#fbf9fc;--white:#ffffff;--mist:#f3edf5;
  --l50:#faf3f8;--l100:#f4e4ef;--l200:#ebcce0;--l300:#dda9cb;--l500:#b96fa4;--l600:#9a5590;--l700:#84447a;
  --warn:#b8513f;--ink:#121014;--ink2:#26212a;--muted:#6e6574;--rule:#e8dfe9;--rule2:#d7c7d6;
  --fd:"Unbounded","Onest",system-ui,sans-serif;--fb:"Onest",system-ui,"Segoe UI",Arial,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rc:4px;--rg:28px;color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink2);font-family:var(--fb);font-size:16px;line-height:1.5}
a{color:var(--l700)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
@media(min-width:900px){.wrap{padding:0 32px}}
.label{font-family:var(--fm);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--l700)}
h1,h2,h3{font-family:var(--fd);font-weight:300;color:var(--ink);margin:0}
h1{font-size:clamp(28px,4.2vw,54px);line-height:1.1;letter-spacing:-.01em}
h2{font-size:clamp(24px,2.8vw,38px);line-height:1.15}
h3{font-size:19px;line-height:1.25;font-weight:400}
p{margin:0}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(251,249,252,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:30px;height:30px;color:var(--l500)}
.brand b{font-family:var(--fd);font-weight:400;letter-spacing:.22em;font-size:14px}
.brand span{display:block;font-family:var(--fm);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.top .sp{flex:1}
.lang{display:flex;border:1px solid var(--rule2);border-radius:999px;overflow:hidden}
.lang button{font:500 12px var(--fm);letter-spacing:.1em;border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--l700);color:#fff}
.nav{display:none;gap:18px}
.nav a{font-size:14px;text-decoration:none;color:var(--ink2)}
.nav a:hover{color:var(--l700)}
@media(min-width:1100px){.nav{display:flex}}
/* hero */
.hero{padding:48px 0 28px;background:radial-gradient(1200px 400px at 85% -10%,var(--l100),transparent 70%)}
.hero .lead{font-size:clamp(17px,1.5vw,20px);max-width:880px;margin-top:18px;color:var(--ink2)}
.synth-banner{display:flex;gap:12px;align-items:flex-start;margin-top:22px;padding:14px 16px;border-radius:var(--rc);background:repeating-linear-gradient(135deg,var(--l50) 0 10px,var(--white) 10px 20px);border:1px solid var(--l200);max-width:880px}
.synth-banner b{font-weight:600}
.counters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px;max-width:880px}
@media(min-width:700px){.counters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.counter{background:var(--white);border:1px solid var(--rule);border-radius:var(--rc);padding:14px}
.counter .n{font-family:var(--fd);font-weight:300;font-size:32px;color:var(--l700);line-height:1}
.counter .t{font-size:13px;color:var(--muted);margin-top:6px}
/* legend */
.legend{display:grid;gap:10px;margin-top:26px;grid-template-columns:1fr}
@media(min-width:800px){.legend{grid-template-columns:repeat(4,minmax(0,1fr))}}
.legend div{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--white);border:1px solid var(--rule);border-radius:var(--rc);padding:10px 12px}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:3px;white-space:nowrap;flex:none}
.chip.f{background:var(--l100);color:var(--l700);border:1px solid var(--l300)}
.chip.a{background:var(--white);color:var(--muted);border:1px dashed var(--muted)}
.chip.p{background:var(--l700);color:#fff;border:1px solid var(--l700)}
.chip.s{background:repeating-linear-gradient(135deg,var(--l100) 0 4px,var(--white) 4px 8px);color:var(--ink2);border:1px solid var(--l300)}
.chip.k{background:var(--mist);color:var(--ink2);border:1px solid var(--rule2)}
section.block{padding:44px 0;border-top:1px solid var(--rule)}
.sub{color:var(--muted);margin-top:10px;max-width:880px}
/* chain */
.chain{margin-top:22px;border:1px solid var(--rule);border-radius:var(--rc);background:var(--white);overflow:hidden}
.chain-head{display:none}
.row{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:transparent;padding:0;cursor:pointer;font:inherit;color:inherit}
.row:first-of-type{border-top:0}
.row:hover{background:var(--l50)}
.row[aria-expanded="true"]{background:var(--l50);box-shadow:inset 4px 0 0 var(--l500)}
.cells{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.cell{padding:12px 16px;border-top:1px dashed var(--rule)}
.cell:first-child{border-top:0}
.cell .k{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}
.cell .v{font-size:14.5px}
.cell .src{font-size:12.5px;color:var(--muted);margin-top:4px}
.cell .chip{margin-top:6px}
.stage-n{font-family:var(--fm);font-size:12px;color:var(--l600);letter-spacing:.08em}
.stage-t{font-family:var(--fd);font-weight:400;font-size:16px;color:var(--ink);margin-top:2px;line-height:1.25}
.gapv{font-family:var(--fd);font-weight:300;font-size:30px;color:var(--l700);line-height:1}
.gapv.ok{color:var(--muted)}
.bar{height:6px;background:var(--mist);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--l500)}
@media(min-width:1000px){
  .chain-head{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr 1.05fr 1.3fr;background:var(--l100);border-bottom:1px solid var(--l200)}
  .chain-head div{padding:12px 14px;font:500 11px/1.3 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--l700);position:relative}
  .chain-head div:not(:last-child)::after{content:"\2192";position:absolute;right:-6px;top:50%;transform:translateY(-50%);color:var(--l500);font-size:15px}
  .cells{grid-template-columns:1.25fr 1fr 1fr 1fr 1.05fr 1.3fr}
  .cell{border-top:0;border-left:1px solid var(--rule);padding:14px}
  .cell:first-child{border-left:0}
  .cell .k{display:none}
}
.hint{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
/* evidence */
.evi{background:var(--white);border:1px solid var(--l200);border-radius:var(--rc);margin-top:18px;padding:20px}
.evi-grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);margin-top:16px}
@media(min-width:1000px){.evi-grid{grid-template-columns:1fr 1fr 1fr}}
.evi .box{border:1px solid var(--rule);border-radius:var(--rc);padding:14px;background:var(--paper)}
.evi .box h4{margin:0 0 8px;font:500 12px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--l700);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evi .box p+p{margin-top:8px}
.quote{border-left:3px solid var(--l300);padding-left:10px;font-size:14.5px}
.fig{font-family:var(--fd);font-weight:300;font-size:26px;color:var(--l700)}
.tblw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--l100);color:var(--l700);font:500 11px var(--fm);letter-spacing:.08em;text-transform:uppercase}
td.mono{font-family:var(--fm);font-size:12.5px;white-space:nowrap}
.yes{color:var(--l700);font-weight:600}
.no{color:var(--warn);font-weight:600}
.na{color:var(--muted)}
.btn{font:500 12px var(--fm);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--l700);color:var(--l700);background:var(--white);padding:9px 14px;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--l50)}
/* simulator */
.sim{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);margin-top:22px}
@media(min-width:1000px){.sim{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.lever{background:var(--white);border:1px solid var(--rule);border-radius:var(--rc);padding:14px;margin-bottom:10px}
.lever.on{border-color:var(--l300);background:var(--l50)}
.lever-top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lever-top label{flex:1;cursor:pointer}
.lever-top .t{font-size:14.5px;color:var(--ink)}
.lever-top .m{font-size:12.5px;color:var(--muted);margin-top:4px}
.sw{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:11px;background:var(--rule2);position:relative;cursor:pointer;flex:none;margin-top:2px;transition:background .16s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .16s}
.sw:checked{background:var(--l700)}
.sw:checked::after{left:21px}
.sw:focus-visible,.row:focus-visible,.btn:focus-visible,.lang button:focus-visible{outline:2px solid var(--l500);outline-offset:2px}
.eff{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.eff input[type=range]{flex:1;min-width:140px;accent-color:var(--l700)}
.eff output{font-family:var(--fm);color:var(--ink2);min-width:40px}
.result{background:var(--white);border:1px solid var(--rule);border-radius:var(--rc);padding:16px}
.rline{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 96px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.rline:last-child{border-bottom:0}
.rbars{display:grid;gap:4px}
.rbar{height:9px;background:var(--mist);border-radius:4px;overflow:hidden;position:relative}
.rbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.rbar.now i{background:var(--rule2)}
.rbar.aft i{background:var(--l500)}
.rnum{font-family:var(--fm);font-size:12px;text-align:right}
.rnum .d{display:block;color:var(--l700)}
.rkey{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.rkey span::before{content:"";display:inline-block;width:12px;height:8px;border-radius:3px;margin-right:6px;vertical-align:middle}
.rkey .kn::before{background:var(--rule2)}
.rkey .ka::before{background:var(--l500)}
.note{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:var(--rc);background:var(--l50);border:1px solid var(--l200)}
.note+.note{margin-top:8px}
.total{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule2)}
.total div{font-size:13px;color:var(--muted)}
.total b{display:block;font-family:var(--fd);font-weight:300;font-size:26px;color:var(--ink)}
.total b.a{color:var(--l700)}
/* cases */
.cases{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);margin-top:20px}
@media(min-width:1000px){.cases{grid-template-columns:repeat(3,minmax(0,1fr))}}
.case{background:var(--white);border:1px solid var(--rule);border-radius:var(--rc);padding:16px}
.case .id{font-family:var(--fm);font-size:12px;color:var(--l600);letter-spacing:.08em}
.case h3{margin-top:4px;font-size:17px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:1fr auto auto;gap:8px;font-size:13px;align-items:center;border-bottom:1px dotted var(--rule);padding-bottom:5px}
.dot{font-family:var(--fm);font-size:11px;padding:2px 6px;border-radius:3px;white-space:nowrap}
.dot.y{background:var(--l100);color:var(--l700)}
.dot.n{background:#f7e4df;color:var(--warn)}
.dot.x{background:var(--mist);color:var(--muted)}
.case .story{font-size:13.5px;margin-top:12px;color:var(--ink2)}
/* method */
.cols{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);margin-top:20px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.card{background:var(--white);border:1px solid var(--rule);border-radius:var(--rc);padding:18px}
.card h3{margin-bottom:10px}
.card ul{margin:0;padding-left:18px}
.card li{margin:5px 0;font-size:14.5px}
.abbr{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.abbr dt{font-family:var(--fm);font-weight:500;color:var(--l700)}
.abbr dd{margin:0}
.swwrap{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);margin-top:22px}
@media(min-width:1000px){.swwrap{grid-template-columns:minmax(0,4fr) minmax(0,7fr)}}
.swgrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.tile{cursor:pointer;aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font:500 11px var(--fm);border:1px solid var(--rule2);background:var(--mist);color:var(--muted);border-bottom-width:3px;padding:0}
.tile.c{border-bottom-color:var(--l300)}.tile.o{border-bottom-color:var(--ink2)}.tile.p{border-bottom-color:var(--warn)}.tile.i{border-bottom-color:var(--muted)}
.tile.open{background:var(--l700);color:#fff;cursor:pointer;border-color:var(--l700)}
.tile[aria-pressed="true"]{outline:2px solid var(--l500);outline-offset:2px}.tile.open[aria-pressed="true"]{background:var(--l600)}
.tile.open:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.swkey{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.swkey span::before{content:"";display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
.swkey .kc::before{background:var(--l300)}.swkey .ko::before{background:var(--ink2)}.swkey .kp::before{background:var(--warn)}.swkey .ki::before{background:var(--muted)}
.swcard{background:var(--white);border:1px solid var(--l200);border-radius:var(--rc);padding:18px}
.swfields{display:grid;gap:10px 18px;grid-template-columns:minmax(0,1fr);margin-top:14px}
@media(min-width:700px){.swfields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.swf .k{font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.swf .v{font-size:14.5px}
.swstate{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:14.5px}
.swstate b{font-weight:500;background:var(--mist);border:1px solid var(--rule2);border-radius:3px;padding:4px 8px}
.swstate i{font-style:normal;color:var(--l500);font-size:18px}
.swwhy{margin-top:14px;padding:12px;border-left:3px solid var(--l500);background:var(--l50);font-size:14.5px}
.princ{margin:12px 0 0;padding-left:18px}.princ li{margin:5px 0;font-size:14px}
.chip.n{background:var(--ink);color:#fff;border:1px solid var(--ink)}
/* tour mode for screen recording (?tour=1) */
.tour-cap{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;max-width:min(1040px,calc(100vw - 32px));background:rgba(18,16,20,.86);color:#fff;font:400 clamp(17px,1.6vw,23px)/1.45 var(--fb);padding:14px 22px;border-radius:10px;text-align:center;display:none}
.tour-cap.on{display:block}
.tour-cap .ru{font-size:.78em;opacity:.78;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.25)}
.tour-cam{position:fixed;right:26px;bottom:120px;width:190px;height:190px;border-radius:50%;overflow:hidden;z-index:61;border:4px solid #fff;box-shadow:0 8px 30px rgba(18,16,20,.25);display:none;background:var(--ink2)}
.tour-cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.tour-cam.on{display:block}
.tour-card{position:fixed;inset:0;z-index:55;background:radial-gradient(1100px 520px at 80% -10%,var(--l100),transparent 70%),var(--paper);display:none;align-items:center;justify-content:center;padding:32px}
.tour-card.on{display:flex}
.tour-card .in{display:flex;gap:56px;align-items:center;max-width:1180px;width:100%;flex-wrap:wrap;justify-content:center}
.tour-card .slot{width:min(340px,70vw);height:min(340px,70vw);border-radius:50%;flex:none}
.tour-card .txt{flex:1;min-width:280px}
.tour-card .txt h1{font-size:clamp(30px,4vw,58px)}
.tour-card .who{font-size:clamp(18px,1.7vw,24px);margin-top:18px;color:var(--ink2)}
.tour-card .links{font-family:var(--fm);font-size:clamp(14px,1.2vw,17px);color:var(--l700);margin-top:18px;line-height:1.8}
body.tour-big .tour-cam{right:auto;bottom:auto;width:min(340px,70vw);height:min(340px,70vw)}
.tour-hl{outline:3px solid var(--l500)!important;outline-offset:6px;border-radius:6px;transition:outline-color .3s}
body.tour .top{position:static}
.chip.e{background:var(--white);color:var(--l700);border:1px dashed var(--l500)}
.chip.h{background:var(--mist);color:var(--ink2);border:1px dotted var(--ink2)}
.intl{display:grid;gap:14px;grid-template-columns:minmax(0,1fr);margin-top:20px}
@media(min-width:900px){.intl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(min-width:1200px){.intl{grid-template-columns:repeat(3,minmax(0,1fr))}}
.icard{background:var(--white);border:1px solid var(--rule);border-radius:var(--rc);padding:16px}
.icard .c{font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--l600)}
.icard h3{font-size:17px;margin-top:6px}
.icard p{font-size:14px;margin-top:8px}
.icard .src{font-size:12px;color:var(--muted);margin-top:10px;word-break:break-word}
footer{border-top:1px solid var(--rule);padding:26px 0 40px;margin-top:20px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="nv-mark" viewBox="0 0 128 128"><g fill="currentColor"><path transform="translate(-3 -5)" d="M 30 34 C 36 34 38 38 41 44 C 45 51 50 52 57 52 C 67 52 72 57 72 65 C 72 72 66 77 66 86 C 66 95 73 98 73 106 C 73 113 68 118 61 118 C 54 118 49 113 49 106 C 49 99 54 95 54 87 C 54 81 51 76 47 70 C 42 62 38 58 30 58 C 22 58 17 53 17 46 C 17 39 22 34 30 34 Z"/><circle cx="86" cy="39" r="14"/><circle cx="25" cy="91" r="10"/></g></symbol></svg>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top"><svg aria-hidden="true"><use href="#nv-mark"/></svg><div><b>NOMOVITA</b><span data-t="tagline"></span></div></a>
    <div class="sp"></div>
    <nav class="nav" aria-label="sections">
      <a href="#chain" data-t="navChain"></a><a href="#switches" data-t="navSw"></a><a href="#sim" data-t="navSim"></a><a href="#intl" data-t="navIntl"></a><a href="#cases" data-t="navCases"></a><a href="#method" data-t="navMethod"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="wrap">
      <div class="label" data-t="kicker"></div>
      <h1 style="margin-top:12px" data-t="title"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="synth-banner"><span class="chip s" data-t="chipS"></span><p data-t="synthBanner"></p></div>
      <div class="counters" id="counters"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <section class="block" id="chain">
    <div class="wrap">

const STAGES = [
 {id:"reg", lever:"p1",

  pkg:PKG_PHC, pay:PAY_PHC,

 intro:{
  ru:"Смена единицы оплаты беременности меняет место и способ оказания помощи и там, где оценивалась, обычно давала небольшую экономию, но обе независимые оценки нидерландского эпизодного платежа за беременность не зафиксировали изменения материнских и неонатальных исходов; наибольший сдвиг исходов в рассмотренном материале получен при смене модели помощи (родильные центры в США, сравнение с подобранной группой), а не формулы оплаты. Многие программы свёрнуты, приостановлены или не вышли за пределы немногих регионов, и эти отрицательные результаты приведены наравне с положительными. Каждая карточка помечена: факт с первоисточником, оценка исследования с указанием дизайна или гипотеза; данные по США предварительные.",
  en:"Changing the payment unit for pregnancy shifts where and how care is delivered and, where evaluated, usually yielded small savings, but both independent evaluations of the Dutch pregnancy bundle found no change in maternal or neonatal outcomes; the largest shift in outcomes in the material reviewed came with a change in the model of care (birth centres in the United States, compared with a matched group), not in the payment formula. Many programmes were wound down, suspended or stayed confined to a few regions, and these negative results are shown alongside the positive ones. Each card is labelled as a fact with a primary source, a study estimate with its design, or a hypothesis; figures for the United States are preliminary."
 },

  {country:{ru:"Англия",en:"England"}, year:"2013/14-2021/22",

   what:{ru:"Маршрут делился на три фазы: дородовая, роды, послеродовая. По каждой фазе заказчик платил единый платёж ведущему поставщику (lead provider), которого выбирала женщина; помощь других поставщиков оплачивал он сам. После обзора Better Births (2016) национальной целью стала непрерывность ведения акушеркой (Midwifery Continuity of Carer).",en:"The pathway was split into three phases: antenatal, delivery, postnatal. For each phase the commissioner made one payment to the lead provider chosen by the woman, who paid for care given by other providers. After the Better Births review (2016), midwifery continuity of carer became a national target."},
   result:{ru:"С 2021/22 оплата за путь прямо названа нерекомендуемой: помощь финансируется через фиксированный элемент контракта, сумма считается как цена, умноженная на плановый объём, взаиморасчёты между поставщиками не должны требоваться. Вне пакета оставались, в частности, ранняя беременность и экстренная гинекология, фетальная медицина, интенсивная терапия, помощь врача общей практики, психиатрия. Срок общинной послеродовой помощи не задан (п. 229), и заказчикам предписано вводить локальные индикаторы, чтобы момент передачи ответственности был безопасным (п. 233). Национальная цель по непрерывности отменена 21.09.2022 из-за кадровой ситуации; тресты без минимальной безопасной укомплектованности обязаны немедленно приостановить модель.",en:"Since 2021/22 pathway payment has been explicitly not recommended: care is funded through the fixed element of the contract, calculated as price times planned volume, and payments between providers should not be needed. Left outside the package were, among others, early pregnancy and emergency gynaecology, fetal medicine, intensive care, general practitioner care and mental health. No time period is set for community postnatal care (para 229), and commissioners must introduce local indicators so that the handover of responsibility is safe (para 233). The national continuity of carer target was withdrawn on 21 September 2022 because of staffing; trusts without minimum safe staffing must suspend the model immediately."},

  {country:{ru:"Нидерланды",en:"Netherlands"}, year:"2017-2025",

   what:{ru:"С 2017 г. страховщик может платить одному контрагенту региона, интегрированной родовой организации (IGO), которая оказывает помощь сама или закупает её у акушерок и больниц. С 2022 г. такая оплата существует параллельно раздельной оплате по дисциплинам; участие добровольное, тарифы свободные.",en:"Since 2017 the insurer can pay one regional counterparty, an integrated birth care organisation (IGO), which delivers care itself or buys it from midwives and hospitals. Since 2022 this payment runs in parallel with separate payment by discipline; participation is voluntary and tariffs are freely negotiated."},
   result:{ru:"Оценка разностью разностей за 2016-2018 гг.: сдвиг к амбулаторным родам под ведением акушерки, расходы ниже на 328 долл. США (5%) на беременность, изменений материнских и неонатальных исходов нет. Пятилетняя оценка (22 307 беременностей в 6 регионах против 69 496 в 20 подобранных контрольных): переводы от акушерки к акушеру-гинекологу в родах снизились на 8,9%, расходы на 121 долл. США на беременность, исходы снова без изменений. Интегральную оплату используют 7 из примерно 70 региональных объединений; у объединений есть утверждённые задачи, но нет оплаты, и в декабре 2025 г. регулятор NZa предложил отдельную тарифную позицию за координацию с 2027 г.",en:"Difference-in-differences evaluation for 2016-2018: a shift to midwife-led outpatient births, spending lower by USD 328 (5%) per pregnancy, no change in maternal or neonatal outcomes. Five-year evaluation (22,307 pregnancies in 6 regions versus 69,496 in 20 matched control regions): transfers from midwife to obstetrician during labour fell by 8.9%, spending by USD 121 per pregnancy, and outcomes again did not change. Only 7 of about 70 regional networks use integrated payment; the networks have approved tasks but no payment, and in December 2025 the regulator NZa proposed a separate tariff item for coordination from 2027."},

  {country:{ru:"17 инициатив: 13 в США, 2 в Великобритании, 1 в Новой Зеландии, 1 в Нидерландах",en:"17 initiatives: 13 in the United States, 2 in the United Kingdom, 1 in New Zealand, 1 in the Netherlands"}, year:"",
   mech:{ru:"Альтернативная оплата в акушерстве: обзор всех найденных схем",en:"Alternative payment in maternity care: review of all schemes found"},
   what:{ru:"Обзорное исследование (scoping review): оплата за результат (2 инициативы), разделение экономии (7), эпизодная оплата (8).",en:"Scoping review: pay for performance (2 initiatives), shared savings (7), episode payment (8)."},
   result:{ru:"Эмпирически оценены 4 из 17: три оценки умеренного качества, одна слабого, сильных нет. В Миннесоте (оплата только фазы родов) значимых эффектов на материнскую заболеваемость нет; в Арканзасе экономия получена за счёт цен стационара. В эпизодных дизайнах встроены исключения (только беременности низкого риска, без мертворождений и ряда сопутствующих заболеваний) и стоп-лосс; чем больше финансового риска переносится на поставщика, тем больше механизмов его смягчения.",en:"Only 4 of the 17 were evaluated empirically: three evaluations of moderate quality, one weak, none strong. In Minnesota (payment for the delivery phase only) there were no significant effects on maternal morbidity; in Arkansas savings came from hospital prices. Episode designs build in exclusions (low-risk pregnancies only, no stillbirths or a number of comorbidities) and stop-loss; the more financial risk is shifted to the provider, the more mitigation mechanisms the design includes."},
   st:"f",
   src:{ru:"doi 10.5334/ijic.5535 (табл. 3)",en:"doi 10.5334/ijic.5535 (table 3)"},
   stage:"all", lever:null},

  {country:{ru:"Систематический обзор: 17 РКИ (Австралия, Канада, Китай, Ирландия, Великобритания)",en:"Systematic review: 17 RCTs (Australia, Canada, China, Ireland, United Kingdom)"}, year:"2024",
   mech:{ru:"Непрерывное ведение акушеркой против других моделей помощи",en:"Midwife continuity of care versus other models of care"},
   what:{ru:"Обновление Кокрейновского обзора: 17 рандомизированных испытаний, 18 533 женщины; большинство исследований не включали женщин высокого риска.",en:"Update of the Cochrane review: 17 randomised trials, 18,533 women; most trials did not include women at high risk."},
   result:{ru:"Самопроизвольные вагинальные роды: рост с 66% до 70% (RR 1,05; 95% ДИ 1,03-1,07); кесарево сечение: снижение с 16% до 15% (RR 0,91; 0,84-0,99); определённость умеренная. Эффект на преждевременные роды не подтверждён (aRR 0,95; 0,78-1,16, низкая определённость); по потере плода от 24 недель и неонатальной смерти определённость очень низкая. Версия 2016 г. показывала снижение преждевременных родов (RR 0,76; 0,64-0,91); обновление этот вывод сняло. Испытаний в странах с низким и средним доходом нет.",en:"Spontaneous vaginal birth: up from 66% to 70% (RR 1.05; 95% CI 1.03-1.07); caesarean section: down from 16% to 15% (RR 0.91; 0.84-0.99); moderate certainty. An effect on preterm birth is not confirmed (aRR 0.95; 0.78-1.16, low certainty); for fetal loss at 24 weeks or later and neonatal death certainty is very low. The 2016 version showed fewer preterm births (RR 0.76; 0.64-0.91); the update withdrew that finding. There are no trials in low- and middle-income countries."},
   st:"a",
   src:{ru:"doi 10.1002/14651858.CD004667.pub6",en:"doi 10.1002/14651858.CD004667.pub6"},
   stage:"all", lever:null},

  {country:{ru:"Эстония",en:"Estonia"}, year:"2022-2026",
   mech:{ru:"Надбавка семейному врачу по индикаторам качества",en:"Bonus to the family doctor by quality indicators"},
   what:{ru:"Семейный врач получает подушевой норматив и надбавку по индикаторам системы качества (PKS), которые считаются по кодам услуг на счетах. Беременность в описании индикаторов на 2026 г. встречается один раз: как один из семи кодов услуг внутри индикатора «гинекологический осмотр», с критерием «коды встречаются на счетах не менее 10 раз за год». По новорождённому окно жёсткое: два профилактических осмотра, первый на 14-60-й день, второй на 75-150-й.",en:"The family doctor receives a capitation rate and a bonus by quality system indicators (PKS), counted from service codes on bills. In the 2026 indicator descriptions pregnancy appears once: as one of seven service codes inside the 'gynaecological examination' indicator, with the criterion that the codes appear on bills at least 10 times a year. For the newborn the window is strict: two preventive check-ups, the first on days 14-60 and the second on days 75-150."},
   result:{ru:"Отдельного индикатора ведения беременности (охват, срок первой явки, полнота обследования, исход) нет ни в редакции 2022 г., ни в редакции 2026 г. Опубликованная количественная оценка влияния системы качества на ведение беременности не найдена.",en:"There is no separate indicator of pregnancy care (coverage, timing of first visit, completeness of tests, outcome) in either the 2022 or the 2026 edition. No published quantitative evaluation of the quality system's effect on pregnancy care was found."},
   st:"f",
   src:{ru:"Tervisekassa, описание индикаторов PKS 2026: https://tervisekassa.ee/sites/default/files/perearstid/indikaatorite_kirjeldused_kodulehel_2026.pdf; 2022: https://tervisekassa.ee/sites/default/files/PKS/Indikaatorite%20kirjeldused%20kodulehel%202022_1.pdf",en:"Tervisekassa, PKS indicator descriptions 2026: https://tervisekassa.ee/sites/default/files/perearstid/indikaatorite_kirjeldused_kodulehel_2026.pdf; 2022: https://tervisekassa.ee/sites/default/files/PKS/Indikaatorite%20kirjeldused%20kodulehel%202022_1.pdf"},
   stage:"pat", lever:"p3"},

  {country:{ru:"Франция",en:"France"}, year:"1998-2024",
   mech:{ru:"Обязательный уровень роддома и диспетчерская переводов",en:"Mandatory maternity unit level and a transfer dispatch unit"},
   what:{ru:"Декреты от 9 октября 1998 г. ввели градацию роддомов по уровню помощи новорождённому (типы I-III) и обязательное участие в перинатальной сети: беременную до родов направляют в учреждение, соответствующее выявленному риску. Это административный допуск, а не тариф.",en:"Decrees of 9 October 1998 introduced levels of maternity units by neonatal care (types I-III) and mandatory membership of a perinatal network: before birth the woman is directed to a unit matching her identified risk. This is an admission rule, not a tariff."},
   result:{ru:"От 10 до 15% родов с риском по-прежнему происходят в учреждениях неподходящего уровня; по данным DREES за 2021 г., в роддомах типа 1 прошли 6% многоплодных, 8% преждевременных родов и 9% родов детьми с низкой массой тела; разброс по территориям от 5% до 17%. С 1995 г. закрыто 40% роддомов. В регионе Овернь - Рона-Альпы региональная ячейка перинатальных переводов подняла долю родов в роддоме подходящего типа до 90%. Градация построена на риске новорождённого и не отвечает росту материнских рисков.",en:"Between 10 and 15% of at-risk births still take place in units of an inappropriate level; according to DREES data for 2021, type 1 units handled 6% of multiple births, 8% of preterm births and 9% of births of low birth weight babies; the range across territories is 5% to 17%. Since 1995, 40% of maternity units have closed. In Auvergne-Rhone-Alpes a regional perinatal transfer unit raised the share of births in a unit of the appropriate type to 90%. The levels are built on newborn risk and do not respond to rising maternal risks."},
   st:"f",
   src:{ru:"Сенат Франции, доклад № 753 (2023-2024): https://www.senat.fr/rap/r23-753-1/r23-753-1_mono.html",en:"French Senate, information report No. 753 (2023-2024): https://www.senat.fr/rap/r23-753-1/r23-753-1_mono.html"},
   stage:"comm", lever:"p5"},

  {country:{ru:"Армения",en:"Armenia"}, year:"2000-2017",
   mech:{ru:"Бонус врачу внутри пакета родов: кесарево против вагинальных родов",en:"Doctor bonus inside the birth package: caesarean versus vaginal birth"},
   what:{ru:"Описательное исследование издержек: прямые переменные издержки на случай 35 219 драм при вагинальных родах и 80 385 драм при кесаревом сечении (отношение 2,28); отношение государственного возмещения 1,64.",en:"Descriptive cost study: direct variable cost per case AMD 35,219 for vaginal birth and AMD 80,385 for caesarean section (ratio 2.28); the ratio of state reimbursement was 1.64."},
   result:{ru:"Бонус акушеру-гинекологу был в 11 раз выше за кесарево сечение, чем за вагинальные роды. Доля кесарева выросла с 7,2% в 2000 г. до 31,0% в 2017 г. Это самый прямой случай в рассмотренном материале, когда структура оплаты внутри пакета родов связана со способом родоразрешения; дизайн описательный.",en:"The bonus to the obstetrician-gynaecologist was 11 times higher for a caesarean section than for a vaginal birth. The caesarean share rose from 7.2% in 2000 to 31.0% in 2017. In the material reviewed this is the most direct case of the payment structure inside a birth package being linked to the mode of delivery; the design is descriptive."},
   st:"a",
   src:{ru:"doi 10.1186/s12884-018-2158-6",en:"doi 10.1186/s12884-018-2158-6"},
   stage:"comm", lever:null},

  {country:{ru:"Руанда",en:"Rwanda"}, year:"2006-2008",
   mech:{ru:"Оплата первичному звену за целевые показатели",en:"Pay for performance in primary care"},
   what:{ru:"Учреждениям первичного звена платили за объём целевых услуг с поправкой на качество. Кластерная рандомизация 166 учреждений (80 в интервенции, 86 в контроле), горизонт 23 месяца; бюджеты контрольных учреждений увеличены на средний размер выплат, чтобы отделить эффект стимула от эффекта денег.",en:"Primary care facilities were paid for the volume of targeted services adjusted for quality. Cluster randomisation of 166 facilities (80 intervention, 86 control), 23-month horizon; control budgets were increased by the average payment so that the incentive effect could be separated from the effect of money."},
   result:{ru:"Роды в учреждении выросли на 23%, качество дородового наблюдения на 0,157 стандартного отклонения (95% ДИ 0,026-0,289). Доля женщин, завершивших 4 дородовых визита, и полная вакцинация детей не выросли. Эффект больше там, где выплата выше, а требуемое усилие меньше.",en:"Facility births rose by 23% and antenatal care quality by 0.157 standard deviations (95% CI 0.026-0.289). The number of women completing 4 antenatal visits and full child vaccination did not increase. The effect was larger where the payment was higher and the effort required was lower."},
   st:"a",
   src:{ru:"doi 10.1016/S0140-6736(11)60177-3",en:"doi 10.1016/S0140-6736(11)60177-3"},
   stage:"reg", lever:"p1"},

  {country:{ru:"США (Арканзас, Огайо; программа CMS Strong Start)",en:"United States (Arkansas, Ohio; CMS Strong Start)"}, year:"2012-2023",
   mech:{ru:"Ретроспективный перинатальный эпизод и гранты на модели помощи",en:"Retrospective perinatal episode and grants for models of care"},
   what:{ru:"В Medicaid в течение года действует обычная оплата за услуги, в конце года расходы на эпизод сверяются с порогом; ответственный поставщик: врач, принявший роды, эпизод запускается живорождением. Арканзас сделал эпизод обязательным для поставщиков Medicaid в 2012 г.; Огайо привязал к оплате эпизода четыре метрики качества. Strong Start проверял три модели дородовой помощи: родильные центры, групповое дородовое наблюдение и maternity care homes.",en:"In Medicaid, ordinary fee-for-service applies during the year, and at year end episode spending is reconciled against a threshold; the accountable provider is the physician who attended the birth, and the episode is triggered by a live birth. Arkansas made the episode mandatory for Medicaid providers in 2012; Ohio tied four quality metrics to episode payment. Strong Start tested three models of antenatal care: birth centres, group antenatal care and maternity care homes."},
   result:{ru:"Арканзас: перинатальные расходы снизились на 3,8% (разность разностей), снижение обеспечено ценами на стационарную помощь, улучшение качества авторы называют ограниченным; программа свёрнута, финальная сверка в 2021 г. Огайо приостановил эпизод с 01.09.2020 и с 01.01.2023 заменил его добровольным проспективным подушевым платежом по двум уровням риска с надбавкой за качество; размер ставок не проверен. Strong Start (нерандомизированное сравнение с подобранной группой): в родильных центрах кесарево 17,5% против 29,0%, преждевременные роды 6,3% против 8,5%; две другие модели значимого улучшения исходов не дали; финансирование услуг прекращено в феврале 2017 г. Данные о статусе программ предварительные: собраны по резюме официальных документов до сверки с полными отчётами MACPAC и CMS.",en:"Arkansas: perinatal spending fell by 3.8% (difference-in-differences), driven by inpatient prices; the authors describe quality improvement as limited; the programme was wound down, with final reconciliation in 2021. Ohio suspended its episode from 1 September 2020 and from 1 January 2023 replaced it with a voluntary prospective per-member-per-month payment at two risk levels plus a quality payment; rate size not verified. Strong Start (non-randomised, matched comparison): in birth centres the caesarean rate was 17.5% versus 29.0% in the comparison group and preterm birth 6.3% versus 8.5%; the two other models produced no significant improvement in birth outcomes; funding for services ended in February 2017. Programme status data are preliminary: drawn from summaries of official documents, before checking against the full MACPAC and CMS reports."},
   st:"a",
   src:{ru:"Арканзас: doi 10.1016/j.jhealeco.2018.06.010; MACPAC: https://www.macpac.gov/wp-content/uploads/2021/09/Arkansas-Perinatal-Episode-of-Care.pdf; Огайо: https://www.medicaid.gov/medicaid/spa/downloads/OH-20-0020.pdf; https://www.medicaid.gov/medicaid/spa/downloads/OH-22-0038.pdf; Strong Start: doi 10.1377/hlthaff.2019.01042; https://www.cms.gov/priorities/innovation/Files/reports/strongstart-prenatal-fg-finalevalrpt.pdf",en:"Arkansas: doi 10.1016/j.jhealeco.2018.06.010; MACPAC: https://www.macpac.gov/wp-content/uploads/2021/09/Arkansas-Perinatal-Episode-of-Care.pdf; Ohio: https://www.medicaid.gov/medicaid/spa/downloads/OH-20-0020.pdf; https://www.medicaid.gov/medicaid/spa/downloads/OH-22-0038.pdf; Strong Start: doi 10.1377/hlthaff.2019.01042; https://www.cms.gov/priorities/innovation/Files/reports/strongstart-prenatal-fg-finalevalrpt.pdf"},
   stage:"all", lever:null}
 ],
 kz:[
  {f:{ru:"В тарифах на пролеченный случай по КЗГ группа O007 «Самопроизвольные роды без осложнений» имеет коэффициент затратоёмкости 0,8883 (156 005,72 тенге), O006 «Самопроизвольные роды, с незначительными по тяжести диагнозами» 1,2396 (217 702,01 тенге), O003 «Кесарево сечение, с незначительными по тяжести диагнозами» 1,524 (267 649,13 тенге), O002 «Кесарево сечение, со значительными по тяжести диагнозами» 2,5889 (454 669,84 тенге); для пар той же тяжести также O005 «Самопроизвольные роды, со значительными по тяжести диагнозами» 1,4393 (252 773,88 тенге), O001 «Кесарево сечение, со значительными по тяжести операциями» 4,7275 (830 256,74 тенге) и O004 «Самопроизвольные роды, со значительными по тяжести операциями» 3,8049 (668 227,15 тенге). Отдельной группы «кесарево сечение без осложнений» нет.",
       en:"In the per-case CCG tariffs, group O007 'Spontaneous delivery without complications' has a cost weight of 0.8883 (156,005.72 tenge), O006 'Spontaneous delivery with minor-severity diagnoses' 1.2396 (217,702.01 tenge), O003 'Caesarean section with minor-severity diagnoses' 1.524 (267,649.13 tenge), and O002 'Caesarean section with major-severity diagnoses' 2.5889 (454,669.84 tenge); for pairs of the same severity also O005 'Spontaneous delivery with major-severity diagnoses' 1.4393 (252,773.88 tenge), O001 'Caesarean section with major-severity operations' 4.7275 (830,256.74 tenge) and O004 'Spontaneous delivery with major-severity operations' 3.8049 (668,227.15 tenge). There is no separate group for caesarean section without complications."},
   src:{ru:"Тарифы ДСМ-170/2020, приложение 2 (в редакции приказа от 31.12.2025 № 176), группы O002, O003, O006, O007",en:"Tariffs DSM-170/2020, annex 2 (as amended by order No. 176 of 31.12.2025), groups O002, O003, O006, O007"},
   a:{ru:"Сопоставимые по тяжести пары дают отношения 1,23 (O003 и O006, обе «с незначительными по тяжести диагнозами»), 1,80 (O002 и O005, обе «со значительными по тяжести диагнозами») и 1,24 (O001 и O004, обе «со значительными по тяжести операциями»); пара O003 и O007 даёт 1,72, но сравнивает группы разной тяжести, поскольку группы «кесарево без осложнений» нет. Это отношения возмещения, а не издержек: в Армении отношение возмещения было 1,64 при отношении издержек 2,28, а бонус врачу за кесарево был в 11 раз выше; казахстанский диапазон 1,23-1,80 включает 1,64, но сопоставимость с издержками не проверена. Нейтральна ли казахстанская структура, можно судить только при сопоставлении с реальными издержками и с тем, как оплата случая распределяется внутри организации; это не проверено.",
      en:"Pairs matched by severity give ratios of 1.23 (O003 and O006, both 'with minor-severity diagnoses'), 1.80 (O002 and O005, both 'with major-severity diagnoses') and 1.24 (O001 and O004, both 'with major-severity operations'); the pair O003 and O007 gives 1.72 but compares groups of different severity, since there is no group for caesarean section without complications. These are reimbursement ratios, not cost ratios: in Armenia the reimbursement ratio was 1.64 against a cost ratio of 2.28, and the doctor bonus for a caesarean was 11 times higher; the Kazakh range of 1.23-1.80 includes 1.64, but comparability with costs has not been checked. Whether the Kazakh structure is neutral can be judged only against actual costs and against how the case payment is distributed inside the organisation; this has not been checked."}},
  {f:{ru:"Знаменатели подиндикаторов стимулирующего компонента ПМСП составляют женщины: «Rp - Число беременных женщин, взятых на учет за квартал» (п. 18), «D - Число выписанных из стационара родильниц за квартал» (п. 20). Балл организации ПМСП умножается на коэффициент по числу беременных на участке (п. 19) или детей до 1 года (п. 20-1); поощрение получают работники участка и координирующие работники, 1 балл равен 4,5 МРП (пп. 16, 17).",
       en:"The denominators of the PHC performance sub-indicators are women: 'Rp - number of pregnant women registered in the quarter' (cl. 18) and 'D - number of mothers discharged from hospital in the quarter' (cl. 20). The PHC organisation's score is multiplied by a coefficient based on the number of pregnant women in the catchment area (cl. 19) or of children under 1 year (cl. 20-1); the reward goes to the catchment area staff and the coordinating staff, and 1 point equals 4.5 monthly calculation indices (cl. 16, 17)."},
   src:{ru:"Правила поощрения ДСМ-278/2020 (ред. приказа от 26.11.2024 № 98; пп. 19 и 20 в ред. приказа от 11.08.2026 № 91), пп. 16-20-1",en:"Reward Rules DSM-278/2020 (as amended by order No. 98 of 26.11.2024; cl. 19 and 20 as amended by order No. 91 of 11.08.2026), cl. 16-20-1"},
   a:{ru:"В отличие от эстонской системы качества семейных врачей, где беременность учтена лишь кодом услуги с порогом 10 раз в год, казахстанские подиндикаторы считаются от женщин: предположение «знаменатель врач, а не женщина» на этих пунктах не подтверждается. Открытыми остаются два вопроса. В знаменатель подиндикаторов п. 18 попадают только взятые на учёт женщины, а в подиндикатор патронажа п. 20 только выписанные родильницы, поэтому не вставшая на учёт беременная в них не учитывается; исключение составляет скрининг первого триместра, знаменатель которого беременные, подлежащие скринингу. По рандомизированной оценке в Руанде стимул сдвигает оплаченные показатели, а неоплаченные нет, тогда как дородового патронажа и комиссионного осмотра среди подиндикаторов нет.",
      en:"Unlike the Estonian family doctor quality system, where pregnancy is counted only as a service code with a threshold of 10 per year, the Kazakh sub-indicators are counted from women: the assumption that the denominator is the doctor rather than the woman is not supported by these clauses. Two questions remain open. In the cl. 18 sub-indicators only registered women enter the denominator, and in the cl. 20 home-visit sub-indicator only mothers discharged from hospital, so a pregnant woman who never registered is not counted there; the exception is first-trimester screening, whose denominator is pregnant women due for screening. In the randomised evaluation in Rwanda the incentive moved the indicators that were paid and not the others, while antenatal home visits and the panel review are not among the sub-indicators."}}
 ],
 hyp:[
  {id:"Г1", ru:"Ни одна организация не отвечает деньгами за маршрут целиком: ПМСП получает подушевой норматив, роддом оплату за пролеченный случай, скрининг оплачивается по тарифу услуги. Проверка: есть ли единица оплаты, охватывающая хотя бы два из семи этапов.",
   en:"No organisation is financially accountable for the pathway as a whole: PHC receives a per capita rate, the maternity facility a payment per treated case, and screening is paid as a tariffed service. Test: whether any payment unit covers at least two of the seven stages."},

/* ============ Engine ============ */
let LANG = "ru";
const ON = {}; const EFF = {};
LEVERS.forEach(l => { ON[l.id] = false; EFF[l.id] = l.def; });
let SEL = "reg";

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const BASE = (function(){const r=mulberry32(P.seed);const out=[];for(let i=0;i<P.N;i++){const u=[];for(let k=0;k<10;k++)u.push(r());out.push({id:"S-"+String(i+1).padStart(4,"0"),u});}return out;})();

function lift(p, e){ return p + e*(1-p); }
function effOf(id){ return ON[id] ? EFF[id]/100 : 0; }

function simulate(e){
  const pE = lift(P.early, e.p1);
  const pM = P.mid*(1-pE)/(1-P.early);
  return BASE.map(b => {
    const u=b.u; const r={id:b.id};
    r.cat = u[0] < pE ? "E" : (u[0] < pE+pM ? "M" : "L");
    r.week = r.cat==="E" ? 5+Math.floor(u[1]*6) : (r.cat==="M" ? 11+Math.floor(u[1]*3) : 14+Math.floor(u[1]*9));
    r.reg = r.cat==="E";
    r.ther = u[2] < lift(P.ther, e.p2);
    r.pat = u[3] < lift(P.pat, e.p3);
    const pS = r.cat==="E" ? lift(P.scrE, e.p4) : (r.cat==="M" ? lift(P.scrM, e.p4) : 0);
    r.scr = u[4] < pS;
    r.scrWhy = r.cat==="L" ? "window" : (r.scr ? "ok" : "late");
    r.risk = u[5] < P.risk;
    r.comm = r.risk ? (u[6] < lift(P.comm, e.p5)) : null;
    r.disc = u[7] < lift(P.disc, e.p6);
    r.pp = u[8] < (r.disc ? P.ppOn : P.ppOff);
    r.all = r.reg && r.ther && r.pat && r.scr && (r.comm!==false) && r.disc && r.pp;
    return r;
  });
}
function zeroEff(){const z={};LEVERS.forEach(l=>z[l.id]=0);return z;}
function curEff(){const z={};LEVERS.forEach(l=>z[l.id]=effOf(l.id));return z;}

function stats(recs){
  const s={};
  STAGES.forEach(st=>{
    let den=0, met=0;
    recs.forEach(r=>{ const v=r[st.id]; if(v===null) return; den++; if(v) met++; });
    s[st.id]={den, met, miss:den-met, share: den? met/den : 0, gap: den? (den-met)/den : 0};
  });
  s.all = recs.filter(r=>r.all).length;
  return s;
}

function pct(x){return nf(x*100)+"%";}

function sampleTable(st, recs){
  const rows = recs.slice(0,8);
  let head='<tr><th>'+esc(t("colId"))+'</th>';
  let body='';
  if(st.id==="reg"){ head+='<th>'+esc(t("colWeek"))+'</th>'; }
  if(st.id==="scr"){ head+='<th>'+esc(t("colWeek"))+'</th><th>'+esc(t("colReason"))+'</th>'; }
  if(st.id==="comm"){ head+='<th>'+esc(t("colRisk"))+'</th>'; }
  if(st.id==="pp"){ head+='<th>'+esc(t("colDisc"))+'</th>'; }
  head+='<th>'+esc(t("colMet"))+'</th></tr>';
  rows.forEach(r=>{
    const v=r[st.id];
    body+='<tr><td class="mono">'+r.id+'</td>';
    if(st.id==="reg") body+='<td class="mono">'+r.week+'</td>';
    if(st.id==="scr") body+='<td class="mono">'+r.week+'</td><td>'+esc(t(r.scrWhy==="window"?"rWindow":(r.scrWhy==="ok"?"rOk":"rLate")))+'</td>';
    if(st.id==="comm") body+='<td>'+esc(r.risk?t("yes"):t("no"))+'</td>';
    if(st.id==="pp") body+='<td>'+esc(r.disc?t("yes"):t("no"))+'</td>';
    body+='<td class="'+(v===null?'na':(v?'yes':'no'))+'">'+esc(v===null?t("na"):(v?t("yes"):t("no")))+'</td></tr>';
  });
  return '<div class="tblw"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}

function extraLine(st, recs, g){
  if(st.id==="scr"){ const w=recs.filter(r=>r.scrWhy==="window").length, l=recs.filter(r=>r.scrWhy==="late").length; return '<p>'+esc(t("exScr").replace("{m}",nf(g.miss)).replace("{w}",nf(w)).replace("{l}",nf(l)))+'</p>'; }
  if(st.id==="pp"){ const d=recs.filter(r=>!r.pp && !r.disc).length; return '<p>'+esc(t("exPp").replace("{m}",nf(g.miss)).replace("{d}",nf(d)))+'</p>'; }
  return "";
}

       '<p style="margin-top:14px"><button type="button" class="btn" id="dl">'+esc(t("download"))+'</button></p></div>';
  h += '</div>';

  const gs = document.getElementById("goSim");

function renderResult(sNow, sAft){
  let h='<div class="label" style="margin-bottom:10px">'+esc(t("resTitle"))+'</div><div class="rkey"><span class="kn">'+esc(t("keyNow"))+'</span><span class="ka">'+esc(t("keyAft"))+'</span>'+chip("s")+chip("a")+'</div>';
  STAGES.forEach((st,i)=>{
    const a=sNow[st.id].share, b=sAft[st.id].share; const d=(b-a)*100;
    h+='<div class="rline"><div>'+(i+1)+'. '+esc(L(st.title))+'</div><div class="rbars"><div class="rbar now"><i style="width:'+(a*100).toFixed(1)+'%"></i></div><div class="rbar aft"><i style="width:'+(b*100).toFixed(1)+'%"></i></div></div>'+
       '<div class="rnum">'+pct(a)+'<span class="d">'+pct(b)+(Math.abs(d)>=0.05?' ('+(d>0?'+':'')+nf(d,1)+' '+esc(t("pp"))+')':'')+'</span></div></div>';
  });
  h+='<div class="total"><div><b>'+nf(sNow.all)+'</b>'+esc(t("totNow"))+'</div><div><b class="a">'+nf(sAft.all)+'</b>'+esc(t("totAft"))+'</div></div><p style="font-size:12.5px;color:var(--muted);margin-top:6px">'+esc(t("totNote"))+'</p>';
  const anyOn = LEVERS.some(l=>ON[l.id]);
  if(!anyOn) h+='<div class="note">'+esc(t("noteOff"))+'</div>';
  if(ON.p1 && sAft.scr.met!==sNow.scr.met) h+='<div class="note">'+esc(t("noteRoute1"))+'</div>';
  if(ON.p6 && sAft.pp.met!==sNow.pp.met) h+='<div class="note">'+esc(t("noteRoute6"))+'</div>';
  h+='<div class="note">'+esc(t("noteSafe"))+'</div>';
  $("#result").innerHTML = h;
}

const CASES = (function(){
  const now = simulate(zeroEff());
  const full = {};LEVERS.forEach(l=>full[l.id]=l.def/100);
  const aft = simulate(full);
  let a=-1,b=-1,c=-1;
  for(let i=0;i<now.length;i++){
    if(a<0 && now[i].cat==="L" && aft[i].cat!=="L" && aft[i].scr) a=i;
    if(b<0 && !now[i].disc && !now[i].pp && aft[i].disc && aft[i].pp) b=i;
    if(c<0 && now[i].risk && now[i].comm===false && aft[i].comm===true) c=i;
  }
  return [{k:"case1",i:a,s:"story1"},{k:"case2",i:b,s:"story2"},{k:"case3",i:c,s:"story3"}];
})();

function dot(v){ if(v===null) return '<span class="dot x">'+esc(t("na"))+'</span>'; return '<span class="dot '+(v?'y':'n')+'">'+esc(v?t("yes"):t("no"))+'</span>'; }
function renderCases(recsNow, recsAft){
  let h='';
  CASES.forEach(c=>{
    if(c.i<0){h+='<div class="case"><h3>'+esc(t(c.k))+'</h3><p class="story">'+esc(t("caseNoneLabel"))+'</p></div>';return;}
    const n=recsNow[c.i], a=recsAft[c.i];
    let story;
    if(c.k==="case1"){ const changed = a.cat!=="L" && a.scr; story = t("story1").replace("{w}",n.week).replace("{a}", changed ? t("story1a").replace("{w}",a.week) : t("story1b")); }
    else if(c.k==="case2"){ story = t("story2").replace("{a}", (a.disc&&a.pp) ? t("story2a") : t("story2b")); }
    else { story = t("story3").replace("{a}", a.comm ? t("story3a") : t("story3b")); }
    h+='<div class="case"><div class="id">'+n.id+' '+chip("s")+'</div><h3>'+esc(t(c.k))+'</h3><ul class="steps"><li><span></span><span class="label" style="font-size:10px">'+esc(t("now"))+'</span><span class="label" style="font-size:10px">'+esc(t("after"))+'</span></li>';
    STAGES.forEach(st=>{ h+='<li><span>'+esc(t("st_"+st.id))+'</span>'+dot(n[st.id])+dot(a[st.id])+'</li>'; });
    h+='</ul><p class="story">'+esc(story)+'</p></div>';
  });
  $("#caseBox").innerHTML = h;
}

function renderMethod(){
  const par = [["parN",nf(P.N)],["parEarly",pct(P.early)],["parMid",pct(P.mid)],["parThe",pct(P.ther)],["parPat",pct(P.pat)],["parScrE",pct(P.scrE)],["parScrM",pct(P.scrM)],["parRisk",pct(P.risk)],["parComm",pct(P.comm)],["parDisc",pct(P.disc)],["parPpOn",pct(P.ppOn)],["parPpOff",pct(P.ppOff)]];
  let tb='<div class="tblw"><table><tbody>'+par.map(p=>'<tr><td>'+esc(t(p[0]))+'</td><td class="mono">'+p[1]+'</td></tr>').join("")+'</tbody></table></div>';

    '<div class="card"><h3>'+esc(t("mSrc"))+' '+chip("f")+'</h3>'+ul(SOURCES.map(s=>L(s)))+'<p style="font-size:13px;color:var(--muted);margin-top:8px">'+esc(t("mSrcNote"))+'</p></div>'+
    '<div class="card"><h3>'+esc(t("mAbbr"))+'</h3><dl class="abbr">'+ABBR[LANG].map(a=>'<dt>'+esc(a[0])+'</dt><dd>'+esc(a[1])+'</dd>').join("")+'</dl></div>';
}

function downloadCSV(){
  const now = simulate(zeroEff()), aft = simulate(curEff());
  const cols = ["record","weeks_at_registration_now","registered_by_10w_now","internist_exam_now","home_visit_3d_now","screen1_in_window_now","risk_factors","panel_36w_now","summary_1d_now","postnatal_on_time_now","weeks_at_registration_after","registered_by_10w_after","internist_exam_after","home_visit_3d_after","screen1_in_window_after","panel_36w_after","summary_1d_after","postnatal_on_time_after"];
  const b = v => v===null ? "" : (v ? 1 : 0);
  const lines = [cols.join(",")];
  now.forEach((n,i)=>{const a=aft[i];lines.push([n.id,n.week,b(n.reg),b(n.ther),b(n.pat),b(n.scr),b(n.risk),b(n.comm),b(n.disc),b(n.pp),a.week,b(a.reg),b(a.ther),b(a.pat),b(a.scr),b(a.comm),b(a.disc),b(a.pp)].join(","));});
  const blob = new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="nomovita_pregnancy_pathway_synthetic.csv"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function renderAll(keepLevers){
  const recsNow = simulate(zeroEff()); const recsAft = simulate(curEff());
  const sNow = stats(recsNow), sAft = stats(recsAft);
  renderCounters(sNow); renderChain(sNow); renderEvidence(sNow, recsNow); renderNormFindings(); renderSwitches(); renderIntl();
  if(!keepLevers) renderLevers(); else document.querySelectorAll(".lever").forEach((el,i)=>el.classList.toggle("on",ON[LEVERS[i].id]));
  renderResult(sNow, sAft); renderCases(recsNow, recsAft);
}

/* ============ Tour mode for screen recording: ?tour=1[&cam=1][&sub=en|ru|off][&lang=en|ru] ============ */
(function(){
  const q = new URLSearchParams(location.search);

  if(LANG!==want){ document.querySelector('.lang button[data-lang="'+want+'"]').click(); }
  let SUB = q.get("sub")||"en";
  const CAP = {
   en:["Hello, I am Leila Ishbayeva, a second-generation doctor and the mother of three sons. Each of them was born differently, and my own pregnancy pathway was a puzzle to me every time, even though I am a doctor: the rules kept changing, and it was unclear how they fit together.", "As a doctor, entrepreneur and health care organiser I learned this: today's rules shape a woman's pathway, and economic incentives can reward one pathway and not another. That is why NomoVita reads norms and payments together.", "Each stage in one line: the norm, the package, how it is paid, who is responsible, the gap and a proposed change. Each cell is marked: fact, assumption or proposal.", "Click a stage to see the data behind the gap. All data here are synthetic.", "The tool also checks the norms themselves. Primary care is scored for visiting a newborn within three days after discharge.", "But the information comes from the hospital, and in the acts we reviewed the hospital gains nothing from that score: the incentive and its condition sit in different organisations.", "Our registry of 45 switches sets an owner, urgency and immediate action for each event; seven are open here.", "Switch on support for same-day handover, and the postnatal visit moves with it. These numbers are assumptions.", "Abroad, changing the payment unit shifted where care happens, but in the Dutch evaluations outcomes did not change; the clearest gains came with a new model of care. Here a caesarean case group is paid 1.2 to 1.8 times as much as a vaginal birth group of the same severity; whether that changes the route is still to be checked.", "The module is open source. Next, we plan a pilot on anonymised data. With UNICEF we want every woman to be able to understand her pathway, and other countries to be able to reuse our approach. Thank you."],
   ru:["Здравствуйте, я Лейла Ишбаева, врач во втором поколении и мама трёх сыновей. Все трое родились по-разному, и мой маршрут беременности каждый раз был для меня загадкой, хотя я сама врач: правила менялись, и было непонятно, как они выстроены.", "Как врач-предприниматель и организатор здравоохранения я поняла: правила сегодня задают маршрут женщины, а экономические стимулы могут поощрять один маршрут и не поощрять другой. Поэтому NomoVita читает нормы и оплату вместе.", "Каждый этап в одну строку: норма, пакет, оплата, ответственный, разрыв и предлагаемое изменение. Каждая ячейка помечена: факт, допущение или предложение.", "Нажимаешь на этап и видишь данные, на которых найден разрыв. Все данные здесь синтетические.", "Инструмент проверяет и сами нормы. Первичную помощь оценивают за патронаж новорождённого в первые трое суток после выписки.", "Но сведения приходят из стационара, а стационару, по просмотренным актам, этот показатель ничего не даёт: стимул и условие его выполнения в разных организациях.", "Реестр из 45 переключателей задаёт для каждого события владельца, срочность и немедленное действие; здесь открыты семь.", "Включаем поддержку передачи сведений в день выписки, и послеродовой патронаж меняется вместе с ней. Цифры здесь допущения.", "В других странах смена единицы оплаты меняла место помощи, но в нидерландских оценках исходы не изменились; заметнее всего исходы сдвигала смена модели помощи. У нас группа кесарева оплачивается в 1,2-1,8 раза дороже группы родов той же тяжести; влияет ли это на маршрут, ещё предстоит проверить.", "Модуль открыт. Дальше мы планируем пилот на обезличенных данных. Вместе с ЮНИСЕФ мы хотим, чтобы каждая женщина могла понять свой маршрут, а другие страны могли повторить наш подход. Спасибо."]
  };
  const card=$("#tourCard"), cap=$("#tourCap"), cam=$("#tourCam"), vid=$("#tourVideo"), slot=$("#tourSlot");
  let camOn = q.get("cam")==="1", stream=null, gen=0;
  function later(f,ms){ const g=gen; setTimeout(()=>{ if(g===gen) f(); }, ms); }
  function startCam(){ if(stream||!navigator.mediaDevices) return; navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(s=>{stream=s;vid.srcObject=s;place();}).catch(()=>{camOn=false;place();}); }
  function hl(el){ document.querySelectorAll(".tour-hl").forEach(x=>x.classList.remove("tour-hl")); if(el){ el.classList.add("tour-hl"); } }
  function go(el, block){ if(el) el.scrollIntoView({behavior:"smooth",block:block||"start"}); }
  function setCard(kind){
    const L2 = LANG==="ru";
    $("#tourKick").textContent = L2 ? "NomoVita · Здоровье матери" : "NomoVita · Maternal health";
    $("#tourTitle").textContent = L2 ? "Маршрут беременности" : "Pregnancy pathway";
    $("#tourWho").innerHTML = (L2 ? "Лейла Ишбаева, основательница NomoVita · Астана, Казахстан" : "Leila Ishbayeva, founder of NomoVita · Astana, Kazakhstan") + '<br><span style="font-size:.78em;color:var(--muted)">' + (L2 ? "врач, предприниматель, председатель РОО «Медицинский инвестиционный альянс», объединения частных медицинских организаций" : "Doctor and entrepreneur; chair of the Medical Investment Alliance, an association of private healthcare providers") + '</span>';
    $("#tourLinks").innerHTML = kind==="end" ? "nomovita.ai<br>github.com/AstralNoMade/nomovita-pregnancy-pathway" : (L2 ? "демонстрация на синтетических данных" : "demonstration on synthetic data");
  }
  function lever(id,on){ const c=document.getElementById("sw_"+id); if(c && c.checked!==on){ c.checked=on; c.dispatchEvent(new Event("change")); } }
  const STEPS = [

    ()=>{ SELSW=44; renderSwitches(); go($("#switches")); later(()=>hl($("#swCard")),60); },
    ()=>{ LEVERS.forEach(l=>lever(l.id,false)); lever("p6",true); go($("#sim")); later(()=>{ const r=document.querySelectorAll("#result .rline"); hl(r[6]); },120); },
    ()=>{ go($("#intl")); later(()=>hl(document.querySelector("#inKzBox .icard")),120); },
    ()=>{ setCard("end"); card.classList.add("on"); hl(null); }
  ];
  let i = 0;
  function place(){

      if(onCard){ const r=slot.getBoundingClientRect(); cam.style.left=r.left+"px"; cam.style.top=r.top+"px"; }

    } else cam.classList.remove("on");

  function show(){
    gen++;
    card.classList.remove("on");

  show();
})();
</script>
